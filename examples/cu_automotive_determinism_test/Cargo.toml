[package]
name = "cu-automotive-determinism-test"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "cu-automotive-determinism-test"
path = "src/main.rs"

[dependencies]
cu29 = { workspace = true }
cu29-helpers = { workspace = true }
cu29-export = { workspace = true }
cu29-unifiedlog = { workspace = true }
cu-uds = { path = "../../components/tasks/cu_uds", version = "0.15.0" }
cu-automotive-payloads = { workspace = true }
serde = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["serde", "cu-uds", "cu-automotive-payloads"]

[features]
default = ["determinism_ci"]
determinism_ci = []
